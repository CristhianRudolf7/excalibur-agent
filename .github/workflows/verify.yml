name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Check public installer copies
        run: |
          cmp scripts/install/install.sh apps/site/public/install.sh
          cmp scripts/install/install.ps1 apps/site/public/install.ps1
          shellcheck scripts/install/install.sh scripts/release/genkey
      - name: Verify
        run: make verify
