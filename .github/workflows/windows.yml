name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main, platform-windows]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check goroutine launches
        run: go run ./scripts/check-no-bare-go
      # windows-latest is amd64 with MinGW; Go's race detector requires cgo.
      - name: Test native backends
        run: go test -race -p 2 -count=1 ./internal/platform/... ./internal/tools/... ./internal/vault/... ./internal/browser/... ./internal/robotlab/... ./internal/automations/... ./internal/envsnap/... ./internal/cli/... ./internal/robot/... ./internal/docextract/... ./internal/scopeguard/... ./internal/codeintel/... ./internal/workspace/... ./cmd/... ./scripts/check-no-bare-go/...

      - name: Test release transport and updater
        run: |
          go test -race -p 2 -count=1 ./internal/gateway ./internal/webui
          go test -race -p 2 -count=1 ./internal/daemon -run '^(TestSignedPublicRelease|TestUpdate.*|TestWindowsImageSwapRollback)$'

  web:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @excalibur/web typecheck
      - name: Lint
        run: pnpm --filter @excalibur/web lint
      - name: Test
        run: pnpm --filter @excalibur/web test
      - name: Test portable launchers
        run: node --test apps/web/scripts/processes.test.mjs
      - name: Build
        run: pnpm --filter @excalibur/web build
