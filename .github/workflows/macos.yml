name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, platform-mac]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.runner }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # Intel baseline (macos-13 was retired by GitHub).
          - runner: macos-15-intel
            arch: amd64
    env:
      # Section 25.1 production SQLite backend; CGO stays at its native default.
      GOFLAGS: -tags=sqlite_fts5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check native toolchain
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          test "$(go env CGO_ENABLED)" = "1"
      - name: Build with CGO and FTS5
        run: go build ./... 2>&1 | tee macos-${{ matrix.arch }}.log
      - name: Vet
        run: go vet ./... 2>&1 | tee -a macos-${{ matrix.arch }}.log
      - name: Test with race detector
        timeout-minutes: 60
        run: go test -race -p 2 -count=1 -timeout 55m -v ./... 2>&1 | tee -a macos-${{ matrix.arch }}.log
      - name: Build without CGO
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: '0'
        run: go build ./... 2>&1 | tee -a macos-${{ matrix.arch }}.log
      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-go-${{ matrix.arch }}
          path: macos-${{ matrix.arch }}.log
          if-no-files-found: warn

  web:
    name: Web (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @excalibur/web...
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee macos-web.log
      - name: Lint
        run: pnpm lint 2>&1 | tee -a macos-web.log
      - name: Test
        run: pnpm test 2>&1 | tee -a macos-web.log
      - name: Build
        run: pnpm build 2>&1 | tee -a macos-web.log
      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-web
          path: apps/web/macos-web.log
          if-no-files-found: warn
