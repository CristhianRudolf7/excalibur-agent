[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excalibur-robotlab"
version = "2.0.0"
description = "Robot Lab deterministic simulation runtime"
requires-python = ">=3.10"
dependencies = [
  "mujoco==3.17.0", "numpy==2.5.4", "opencv-python-headless==5.0.0.93",
  "pillow==13.0.0", "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["robotlab*"]

[tool.setuptools.package-data]
robotlab = ["world/defaults/*.json", "menagerie_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
